server:
  port: 8086

spring:
  application:
    name: qr-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/qr_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

# Local filesystem path where QR PNG files are stored.
# Override at runtime: QR_STORAGE_PATH=/var/nixtap/qr-codes
qr:
  storage:
    path: ${QR_STORAGE_PATH:./qr-storage}
  image:
    size: 300   # pixels (width = height, QR codes are square)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
