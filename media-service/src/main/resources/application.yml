server:
  port: 8095

spring:
  application:
    name: media-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/media_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  # Multipart upload configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB        # per single file
      max-request-size: 20MB     # per request (allows multiple files)

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

# Local filesystem path where uploaded files are stored
# Override at runtime: MEDIA_STORAGE_PATH=/var/nixtap/media
media:
  storage:
    path: ${MEDIA_STORAGE_PATH:./media-storage}
  base-url: ${MEDIA_BASE_URL:http://localhost:8095}
  allowed-types: image/jpeg,image/png,image/webp,image/gif,application/pdf
  max-file-size-bytes: 10485760

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
