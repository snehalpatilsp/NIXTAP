spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# -----------------------------------------------------------------------
# Route 0: AUTH-SERVICE  →  /api/v1/auth/**
# -----------------------------------------------------------------------
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

# -----------------------------------------------------------------------
# Route 1: PROFILE-SERVICE
# Handles profiles, social links (merged), vCard contacts (merged)
# -----------------------------------------------------------------------
spring.cloud.gateway.routes[1].id=profile-service
spring.cloud.gateway.routes[1].uri=lb://PROFILE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/profiles/**,/api/v1/social/**,/api/v1/social-links/**,/api/v1/contacts/**

# -----------------------------------------------------------------------
# Route 2: BUSINESS-CARD-SERVICE
# Handles cards, NFC tags (merged), themes (merged)
# -----------------------------------------------------------------------
spring.cloud.gateway.routes[2].id=business-card-service
spring.cloud.gateway.routes[2].uri=lb://BUSINESS-CARD-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/cards/**,/api/v1/nfc/**,/api/v1/themes/**

